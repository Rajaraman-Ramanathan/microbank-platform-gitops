apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "41"
spec:
  project: platform
  source:
    repoURL: https://github.com/Rajaraman-Ramanathan/microbank-platform-gitops.git
    targetRevision: stage
    path: platform/security/cert-manager/issuers
  destination:
    name: microbank-stage-cluster
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true