apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: limit-ranges
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://github.com/Rajaraman-Ramanathan/microbank-platform-gitops.git
    targetRevision: stage
    path: platform/governance/limit-ranges
  destination:
    name: microbank-stage-cluster
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true