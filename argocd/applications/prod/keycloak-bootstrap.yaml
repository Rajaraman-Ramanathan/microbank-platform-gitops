apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "45"
spec:
  project: platform
  source:
    repoURL: https://github.com/Rajaraman-Ramanathan/microbank-platform-gitops.git
    targetRevision: master
    path: platform/identity/keycloak/bootstrap
  destination:
    name: microbank-prod-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true