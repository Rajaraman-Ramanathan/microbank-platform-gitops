apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  generators:
    - git:
        repoURL: https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
        revision: master
        directories:
          - path: environments/prod/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: microbank
      sources:
        - repoURL: https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
          targetRevision: master
          path: workloads/charts/microservice-base
          helm:
            valueFiles:
              - $values/environments/prod/{{path.basename}}/values.yaml
        - repoURL: https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
          targetRevision: master
          ref: values
      destination:
        name: microbank-prod-cluster
        namespace: 'microbank-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true