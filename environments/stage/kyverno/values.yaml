kyverno:

  admissionController:
    replicas: 2

    podLabels:
      network-role: security

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  backgroundController:

    podLabels:
      network-role: security

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  cleanupController:

    podLabels:
      network-role: security

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  reportsController:

    podLabels:
      network-role: security

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  serviceMonitor:
    enabled: true