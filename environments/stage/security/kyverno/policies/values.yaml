###############################################################################
# Global Policy Configuration
###############################################################################

global:
  validationFailureAction: Audit
  background: true
  failurePolicy: Fail
  emitWarning: true

###############################################################################
# Container Security Policies
###############################################################################

containers:
  enabled: true
  policy:
    name: container-security-policy

  ###########################################################################
  # Require containerPort
  ###########################################################################

  containerPorts:
    enabled: true

  ###########################################################################
  # Environment Variable Validation
  ###########################################################################

  envValidation:
    enabled: true
    sensitiveVariables:
      - PASSWORD
      - DB_PASSWORD
      - DB_USERNAME
      - DATABASE_PASSWORD
      - DATABASE_USERNAME
      - SECRET
      - CLIENT_SECRET
      - JWT_SECRET
      - JWT_SIGNING_KEY
      - TOKEN
      - ACCESS_TOKEN
      - REFRESH_TOKEN
      - ACCESS_KEY
      - SECRET_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - API_KEY
      - PRIVATE_KEY

  ###########################################################################
  # Init Containers
  ###########################################################################

  initContainers:
    enabled: true

  ###########################################################################
  # Lifecycle Hooks
  ###########################################################################

  lifecycleHooks:
    enabled: true

  ###########################################################################
  # Termination Message Policy
  ###########################################################################

  terminationMessagePolicy:
    enabled: true
    requiredValue: FallbackToLogsOnError

###############################################################################
# Pod Security Policies
###############################################################################

podSecurity:
  enabled: true
  policy:
    name: pod-security-policy

  ###########################################################################
  # Require runAsNonRoot
  ###########################################################################

  runAsNonRoot:
    enabled: true

  ###########################################################################
  # Require ReadOnly Root Filesystem
  ###########################################################################

  readOnlyRootFilesystem:
    enabled: true

  ###########################################################################
  # Disallow Privilege Escalation
  ###########################################################################

  allowPrivilegeEscalation:
    enabled: true

  ###########################################################################
  # Linux Capabilities
  ###########################################################################

  capabilities:
    enabled: true
    requiredDropCapabilities:
      - ALL

  ###########################################################################
  # Seccomp
  ###########################################################################

  seccomp:
    enabled: true
    requiredProfile: RuntimeDefault

  ###########################################################################
  # Reserved for Future Policies
  ###########################################################################

  hostNamespaces:
    enabled: true

  hostPath:
    enabled: true

  hostPorts:
    enabled: true

  procMount:
    enabled: true

  volumeTypes:
    enabled: true

###############################################################################
# Image Security Policies
###############################################################################

imageSecurity:
  enabled: true
  policy:
    name: image-security-policy

  ###########################################################################
  # Allowed Registries
  ###########################################################################

  allowedRegistries:
    enabled: true
    registries:
      - docker.io/
      - ghcr.io/
      - quay.io/
      - 65486509.dkr.ecr.ap-south-1.amazonaws.com/

  ###########################################################################
  # Latest Tag
  ###########################################################################

  disallowLatestTag:
    enabled: true

  ###########################################################################
  # Image Pull Policy
  ###########################################################################

  imagePullPolicy:
    enabled: true
    requiredValue: Always

  ###########################################################################
  # Future Policies
  ###########################################################################

  trustedBaseImages:
    enabled: false

  imageSignatures:
    enabled: false

  imageAttestations:
    enabled: false

  imageSbom:
    enabled: false

  imageVulnerability:
    enabled: false

###############################################################################
# Resource Governance Policies
###############################################################################

resources:
  enabled: true
  policy:
    name: resource-governance-policy

  ###########################################################################
  # Resource Requests
  ###########################################################################

  resourceRequests:
    enabled: true

  ###########################################################################
  # Resource Limits
  ###########################################################################

  resourceLimits:
    enabled: true

  ###########################################################################
  # Priority Class
  ###########################################################################

  priorityClassRequired:
    enabled: true

  ###########################################################################
  # Future Namespace Governance
  ###########################################################################

  resourceQuotaRequired:
    enabled: false

  limitRangeRequired:
    enabled: false

###############################################################################
# Metadata Policies
###############################################################################

metadata:

  enabled: true

  policy:

    name: metadata-policy

  ###########################################################################
  # Kubernetes Standard Labels
  ###########################################################################

  requiredLabels:
    enabled: true
    labels:
      - app.kubernetes.io/name
      - app.kubernetes.io/instance
      - app.kubernetes.io/version
      - app.kubernetes.io/component
      - app.kubernetes.io/part-of
      - app.kubernetes.io/managed-by

  ###########################################################################
  # Organization Annotations
  ###########################################################################

  requiredAnnotations:
    enabled: true
    annotations:
      - platform.microbank.io/owner
      - platform.microbank.io/team
      - platform.microbank.io/support

  ###########################################################################
  # Future Rules
  ###########################################################################

  recommendedLabels:
    enabled: false

  immutableLabels:
    enabled: false

  immutableAnnotations:
    enabled: false

###############################################################################
# Storage Policies
###############################################################################

storage:
  enabled: true
  policy:
    name: storage-policy

  disallowHostPath:
    enabled: true

  requireStorageClass:
    enabled: true

  allowedAccessModes:
    enabled: true

    allowed:
      - ReadWriteOnce

  volumeMode:
    enabled: true
    required: Filesystem

  pvcSizeLimit:
    enabled: false
    maximum: 20Gi

  readOnlyVolumes:
    enabled: false

###############################################################################
# Probe Policies
###############################################################################

probes:
  enabled: true
  policy:
    name: probe-policy

  ###########################################################################
  # Liveness Probe
  ###########################################################################

  liveness:
    enabled: true

  ###########################################################################
  # Readiness Probe
  ###########################################################################

  readiness:
    enabled: true

  ###########################################################################
  # Startup Probe
  ###########################################################################

  startup:
    enabled: false

  ###########################################################################
  # Probe Configuration
  ###########################################################################

  configuration:
    enabled: true
    timeout:
      min: 1
      max: 30

    period:
      min: 5
      max: 60

    failureThreshold:
      min: 1
      max: 10

    successThreshold:
      min: 1
      max: 5

    initialDelay:
      min: 0
      max: 300

###############################################################################
# Secret Policies
###############################################################################

secrets:
  enabled: true
  policy:
    name: secret-policy
  sensitiveVariables:
      - PASSWORD
      - DB_PASSWORD
      - DB_USERNAME
      - DATABASE_PASSWORD
      - DATABASE_USERNAME
      - SECRET
      - CLIENT_SECRET
      - JWT_SECRET
      - JWT_SIGNING_KEY
      - TOKEN
      - ACCESS_TOKEN
      - REFRESH_TOKEN
      - ACCESS_KEY
      - SECRET_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - API_KEY
      - PRIVATE_KEY

  ###########################################################################
  # Inline Secret Detection
  ###########################################################################

  disallowInlineSecrets:
    enabled: true

  ###########################################################################
  # Secret References
  ###########################################################################

  requireSecretReferences:
    enabled: false

  ###########################################################################
  # Secret Volume Mounts
  ###########################################################################

  requireReadOnlySecretMounts:
    enabled: false

  ###########################################################################
  # Secret Types
  ###########################################################################

  restrictSecretTypes:
    enabled: false
    allowed:
      - Opaque
      - kubernetes.io/tls
      - kubernetes.io/dockerconfigjson

###############################################################################
# Networking Policies
###############################################################################

networking:
  enabled: true
  policy:
    name: networking-policy

  ###########################################################################
  # Service Types
  ###########################################################################

  serviceTypes:
    enabled: true
    allowed:
      - ClusterIP

  ###########################################################################
  # Ingress TLS
  ###########################################################################

  ingressTLS:
    enabled: true

  ###########################################################################
  # Ingress Class
  ###########################################################################

  ingressClass:
    enabled: true
    allowed:
      - nginx

  ###########################################################################
  # Host Network
  ###########################################################################

  hostNetwork:
    enabled: true