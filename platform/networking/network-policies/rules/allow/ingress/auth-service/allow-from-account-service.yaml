apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-account-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          tier: workloads
      podSelector:
        matchLabels:
          network-role: backend
          app.kubernetes.io/name: account-service
    ports:
    - protocol: TCP
      port: 8081