{{- range .Values.clusterIssuers }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  {{- if eq .type "selfSigned" }}
  selfSigned: {}
  {{- end }}
  {{- if eq .type "acme" }}
  acme:
    email: {{ .email }}
    server: {{ .server }}
    privateKeySecretRef:
      name: {{ .privateKeySecret }}
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .ingressClass }}
  {{- end }}
---
{{- end }}