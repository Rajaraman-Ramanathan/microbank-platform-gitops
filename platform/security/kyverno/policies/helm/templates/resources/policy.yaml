{{- if .Values.resources.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ include "kyverno.resources.policyName" . }}
  annotations:
    policies.kyverno.io/title: Resource Governance
    policies.kyverno.io/category: Runtime Governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: |
      Enforces enterprise resource management standards
      for Kubernetes workloads.
spec:
  validationFailureAction: {{ .Values.global.validationFailureAction }}
  background: {{ .Values.global.background }}
  failurePolicy: {{ .Values.global.failurePolicy }}
  emitWarning: {{ .Values.global.emitWarning }}
  rules:
{{ include "kyverno.resources.rule.resourceRequests" . | nindent 4 }}

{{ include "kyverno.resources.rule.resourceLimits" . | nindent 4 }}

{{ include "kyverno.resources.rule.priorityClassRequired" . | nindent 4 }}

{{/*
Future namespace governance

{{ include "kyverno.resources.rule.resourceQuotaRequired" . | nindent 4 }}

{{ include "kyverno.resources.rule.limitRangeRequired" . | nindent 4 }}

*/}}

{{- end }}