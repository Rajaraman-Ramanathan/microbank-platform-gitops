#
# ============================================================================
# Falco Enterprise Policy Pack
# Shared Lists
#
# Purpose:
#   Reusable data definitions consumed by macros and rules.
#
# Guidelines:
#   - No rule logic.
#   - No conditions.
#   - No environment-specific values.
#   - Keep lists generic and reusable.
# ============================================================================

# -----------------------------------------------------------------------------
# Container Shells
# -----------------------------------------------------------------------------

- list: shell_binaries
  items:
    - sh
    - bash
    - ash
    - dash
    - zsh

# -----------------------------------------------------------------------------
# Privilege Escalation Utilities
# -----------------------------------------------------------------------------

- list: privilege_binaries
  items:
    - sudo
    - su
    - newgrp
    - sg

# -----------------------------------------------------------------------------
# Linux Interpreters
# -----------------------------------------------------------------------------

- list: interpreter_binaries
  items:
    - python
    - python3
    - perl
    - ruby
    - php
    - lua

# -----------------------------------------------------------------------------
# Package Managers
# -----------------------------------------------------------------------------

- list: package_manager_binaries
  items:
    - apt
    - apt-get
    - apk
    - yum
    - dnf
    - rpm
    - dpkg

# -----------------------------------------------------------------------------
# Download Utilities
# -----------------------------------------------------------------------------

- list: download_binaries
  items:
    - curl
    - wget

# -----------------------------------------------------------------------------
# Network Utilities
# -----------------------------------------------------------------------------

- list: network_binaries
  items:
    - nc
    - netcat
    - socat
    - telnet

# -----------------------------------------------------------------------------
# Archiving Utilities
# -----------------------------------------------------------------------------

- list: archive_binaries
  items:
    - tar
    - gzip
    - unzip
    - zip

# -----------------------------------------------------------------------------
# File Permission Utilities
# -----------------------------------------------------------------------------

- list: permission_binaries
  items:
    - chmod
    - chown
    - chgrp

# -----------------------------------------------------------------------------
# Sensitive System Files
# -----------------------------------------------------------------------------

- list: sensitive_files
  items:
    - /etc/passwd
    - /etc/shadow
    - /etc/group
    - /etc/gshadow
    - /etc/sudoers

# -----------------------------------------------------------------------------
# Sensitive Directories
# -----------------------------------------------------------------------------

- list: sensitive_directories
  items:
    - /etc
    - /usr/bin
    - /usr/sbin
    - /bin
    - /sbin

# -----------------------------------------------------------------------------
# Writable Execution Paths
# -----------------------------------------------------------------------------

- list: writable_execution_paths
  items:
    - /tmp
    - /var/tmp
    - /dev/shm

# -----------------------------------------------------------------------------
# Java Runtime
# -----------------------------------------------------------------------------

- list: java_binaries
  items:
    - java

# -----------------------------------------------------------------------------
# Suspicious Child Processes
# -----------------------------------------------------------------------------

- list: suspicious_child_processes
  items:
    - bash
    - sh
    - ash
    - python
    - python3
    - perl
    - nc
    - socat
    - curl
    - wget

# -----------------------------------------------------------------------------
# Capability Utilities
# -----------------------------------------------------------------------------

- list: capability_binaries
  items:
    - setcap
    - getcap

# -----------------------------------------------------------------------------
# Kubernetes Client Utilities
# -----------------------------------------------------------------------------

- list: kubernetes_binaries
  items:
    - kubectl