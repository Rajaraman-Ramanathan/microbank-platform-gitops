# -----------------------------------------------------------------------------
# Java Application Accessing Sensitive Directory
# -----------------------------------------------------------------------------

- rule: Java Application Accessing Sensitive Directory

  desc: >
    Detect Java application processes accessing
    sensitive operating system directories.

  condition: >
    open_read
    and java_process
    and sensitive_directory_access
    and not trusted_platform_component

  output: >
    Java application accessed sensitive directory
    (user=%user.name
    command=%proc.cmdline
    file=%fd.name
    container=%container.name
    image=%container.image.repository
    namespace=%k8s.ns.name
    pod=%k8s.pod.name)

  priority: ERROR

  tags:
    - filesystem
    - application
    - sensitive-directory

