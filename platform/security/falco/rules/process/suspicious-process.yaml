# -----------------------------------------------------------------------------
# Java Application Executing Permission Utility
# -----------------------------------------------------------------------------

- rule: Java Application Executing Permission Utility

  desc: >
    Detect Java application processes executing
    Linux permission management utilities.

  condition: >
    container_spawned_process
    and permission_process
    and java_parent_process
    and not trusted_platform_component

  output: >
    Java application executed permission utility
    (user=%user.name
    command=%proc.cmdline
    parent=%proc.pname
    container=%container.name
    image=%container.image.repository
    namespace=%k8s.ns.name
    pod=%k8s.pod.name)

  priority: ERROR

  tags:
    - process
    - permission
    - application

