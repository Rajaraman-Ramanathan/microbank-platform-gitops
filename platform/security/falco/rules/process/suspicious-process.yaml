# -----------------------------------------------------------------------------
# Java Application Executing Archive Utility
# -----------------------------------------------------------------------------

- rule: Java Application Executing Archive Utility

  desc: >
    Detect Java application processes executing
    archive utilities inside application containers.

  condition: >
    container_spawned_process
    and archive_process
    and java_parent_process
    and not trusted_platform_component

  output: >
    Java application executed archive utility
    (user=%user.name
    command=%proc.cmdline
    parent=%proc.pname
    container=%container.name
    image=%container.image.repository
    namespace=%k8s.ns.name
    pod=%k8s.pod.name)

  priority: WARNING

  tags:
    - process
    - archive
    - application