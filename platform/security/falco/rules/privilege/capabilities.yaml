# -----------------------------------------------------------------------------
# Java Application Executing Capability Utility
# -----------------------------------------------------------------------------

- rule: Java Application Executing Capability Utility

  desc: >
    Detect Java application processes executing Linux
    capability management utilities inside application containers.

  condition: >
    container_spawned_process
    and capability_process
    and java_parent_process
    and not trusted_platform_component

  output: >
    Java application executed capability utility
    (user=%user.name
    command=%proc.cmdline
    parent=%proc.pname
    container=%container.name
    image=%container.image.repository
    namespace=%k8s.ns.name
    pod=%k8s.pod.name)

  priority: ERROR

  tags:
    - privilege
    - capabilities
    - application

# -----------------------------------------------------------------------------
# Unexpected Capability Utility Execution
# -----------------------------------------------------------------------------

- rule: Unexpected Capability Utility Execution

  desc: >
    Detect capability management utilities executed by
    unexpected parent processes inside application containers.

  condition: >
    container_spawned_process
    and capability_process
    and not (
      shell_parent_process
      or java_parent_process
      or interpreter_parent_process
    )
    and not trusted_platform_component

  output: >
    Capability utility executed by unexpected parent process
    (user=%user.name
    command=%proc.cmdline
    parent=%proc.pname
    container=%container.name
    image=%container.image.repository
    namespace=%k8s.ns.name
    pod=%k8s.pod.name)

  priority: WARNING

  tags:
    - privilege
    - capabilities
    - anomaly