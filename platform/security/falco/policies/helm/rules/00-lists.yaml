#
# ============================================================================
# Falco Enterprise Policy Pack
# Shared Lists
#
# Purpose:
#   Reusable data definitions consumed by macros and rules.
#
# Guidelines:
#   - No rule logic.
#   - No conditions.
#   - No environment-specific values.
#   - Keep lists generic and reusable.
# ============================================================================

# -----------------------------------------------------------------------------
# Container Shells
# -----------------------------------------------------------------------------

- list: shell_binaries
  items:
    - sh
    - bash
    - ash
    - dash
    - zsh

# -----------------------------------------------------------------------------
# Privilege Escalation Utilities
# -----------------------------------------------------------------------------

- list: privilege_binaries
  items:
    - sudo
    - su
    - newgrp
    - sg

# -----------------------------------------------------------------------------
# Linux Interpreters
# -----------------------------------------------------------------------------

- list: interpreter_binaries
  items:
    - python
    - python3
    - perl
    - ruby
    - php
    - lua

# -----------------------------------------------------------------------------
# Package Managers
# -----------------------------------------------------------------------------

- list: package_manager_binaries
  items:
    - apt
    - apt-get
    - apk
    - yum
    - dnf
    - rpm
    - dpkg

# -----------------------------------------------------------------------------
# Download Utilities
# -----------------------------------------------------------------------------

- list: download_binaries
  items:
    - curl
    - wget

# -----------------------------------------------------------------------------
# Network Utilities
# -----------------------------------------------------------------------------

- list: remote_connection_binaries
  items:
    - nc
    - netcat
    - socat
    - telnet

# -----------------------------------------------------------------------------
# Network Reconnaissance Utilities
# -----------------------------------------------------------------------------

- list: network_recon_binaries
  items:
    - nmap
    - tcpdump
    - tshark
    - netstat
    - ss
    - dig
    - nslookup
    - host
    - arp
    - ip

# -----------------------------------------------------------------------------
# Archiving Utilities
# -----------------------------------------------------------------------------

- list: archive_binaries
  items:
    - tar
    - gzip
    - unzip
    - zip

# -----------------------------------------------------------------------------
# File Permission Utilities
# -----------------------------------------------------------------------------

- list: permission_binaries
  items:
    - chmod
    - chown
    - chgrp

# -----------------------------------------------------------------------------
# Sensitive System Files
# -----------------------------------------------------------------------------

- list: sensitive_files
  items:
    - /etc/passwd
    - /etc/shadow
    - /etc/group
    - /etc/gshadow
    - /etc/sudoers

# -----------------------------------------------------------------------------
# Sensitive Directories
# -----------------------------------------------------------------------------

- list: sensitive_directories
  items:
    - /etc
    - /usr/bin
    - /usr/sbin
    - /bin
    - /sbin

# -----------------------------------------------------------------------------
# Writable Execution Paths
# -----------------------------------------------------------------------------

- list: writable_execution_paths
  items:
    - /tmp
    - /var/tmp
    - /dev/shm

# -----------------------------------------------------------------------------
# Java Runtime
# -----------------------------------------------------------------------------

- list: java_binaries
  items:
    - java

# -----------------------------------------------------------------------------
# Capability Utilities
# -----------------------------------------------------------------------------

- list: capability_binaries
  items:
    - setcap
    - getcap
    - capsh
    - setpriv

# -----------------------------------------------------------------------------
# Kubernetes Client Utilities
# -----------------------------------------------------------------------------

- list: kubernetes_binaries
  items:
    - kubectl

# -----------------------------------------------------------------------------
# Trusted platform components
# -----------------------------------------------------------------------------

- list: trusted_platform_namespaces
  items:
    - kube-system
    - istio-system
    - monitoring
    - aws-load-balancer-system
    - cert-manager
    - external-secrets
    - external-dns-system
    - falco
    - kyverno

# -----------------------------------------------------------------------------
# Application Namespaces
# -----------------------------------------------------------------------------

- list: application_namespaces
  items:
    - microbank-apigateway
    - microbank-auth
    - microbank-account
    - microbank-transaction
    - microbank-document
    - microbank-notification